R-1
IP address
ether1: 192.168.1.1/24
ether2: 192.168.2.1/24
ether3: 192.168.3.1/24
ether4: 192.168.4.1/24

[admin@Router-1] > ip address add address=192.168.1.1/24 interface=ether1
[admin@Router-1] > ip address add address=192.168.2.1/24 interface=ether2
[admin@Router-1] > ip address add address=192.168.3.1/24 interface=ether3
[admin@Router-1] > ip address add address=192.168.4.1/24 interface=ether4
[admin@Router-1] > ip address print 
Flags: X - disabled, I - invalid, D - dynamic 
 #   ADDRESS            NETWORK         INTERFACE                              
 0   192.168.1.1/24     192.168.1.0     ether1                                 
 1   192.168.2.1/24     192.168.2.0     ether2                                 
 2   192.168.3.1/24     192.168.3.0     ether3                                 
 3   192.168.4.1/24     192.168.4.0     ether4 

