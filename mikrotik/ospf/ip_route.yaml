🔧 1. Router-1
/routing ospf instance
set [ find default=yes ] router-id=1.1.1.1 distribute-default=never

[admin@Router-1] > routing ospf instance print 
Flags: X - disabled, * - default 
 0  * name="default" router-id=1.1.1.1 distribute-default=never 
      redistribute-connected=no redistribute-static=no redistribute-rip=no 
      redistribute-bgp=no redistribute-other-ospf=no metric-default=1 
      metric-connected=20 metric-static=20 metric-rip=20 metric-bgp=auto 
      metric-other-ospf=auto in-filter=ospf-in out-filter=ospf-out 

/routing ospf network
add network=192.168.1.0/24 area=backbone

[admin@Router-1] > routing ospf network print 
Flags: X - disabled, I - invalid 
 #   NETWORK            AREA                                                   
 0   192.168.1.0/24     backbone 

